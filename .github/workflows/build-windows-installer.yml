name: Build Windows Installer (v6 Green)

on:
  workflow_dispatch:
  push:
    branches: [main, v6-green]

permissions:
  contents: read

jobs:
  build:
    name: Hermes-Setup.exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Cache Rust targets
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: apps/bootstrap-installer/src-tauri

      - name: Build installer (no Azure signing)
        run: npm run tauri:build
        working-directory: apps/bootstrap-installer

      - name: Upload NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Hermes-Setup-installer-v6
          path: apps/bootstrap-installer/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload raw exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Hermes-Setup-raw-v6
          path: apps/bootstrap-installer/src-tauri/target/release/Hermes-Setup.exe
